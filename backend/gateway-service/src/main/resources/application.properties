spring.application.name=gateway-service
server.port=8080
spring.main.web-application-type=reactive

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://auth-service:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[0].filters[1]=AddRequestHeader=X-Forwarded-Prefix,/auth

spring.cloud.gateway.routes[1].id=game-service
spring.cloud.gateway.routes[1].uri=http://game-service:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/game/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[1].filters[1]=AddRequestHeader=X-Forwarded-Prefix,/game

spring.cloud.gateway.routes[2].id=api-auth-service
spring.cloud.gateway.routes[2].uri=http://auth-service:8081
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[3].id=api-game-room-service
spring.cloud.gateway.routes[3].uri=http://game-service:8082
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/game_rooms/**

spring.cloud.gateway.routes[4].id=api-game-service
spring.cloud.gateway.routes[4].uri=http://game-service:8082
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/games/**

spring.cloud.gateway.routes[5].id=ws-game-service
spring.cloud.gateway.routes[5].uri=http://game-service:8082
spring.cloud.gateway.routes[5].predicates[0]=Path=/ws/**

spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposedHeaders=Authorization,Location
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600
