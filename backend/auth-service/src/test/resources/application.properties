spring.application.name=auth-service

spring.datasource.url=jdbc:h2:mem:authdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Avoid the production default schema (it does not exist in H2)
spring.jpa.properties.hibernate.default_schema=

# Disable AMQP autoconfig in tests
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# JWT settings (Base64-encoded 64-byte HMAC-SHA512 key)
jwt.secret=VGVzdFNlY3JldEZvclVuaXRUZXN0c09ubHlOb3RGb3JQcm9kdWN0aW9uVXNlVGVzdFNlY3JldEZvclVuaXRUZXN0c09ubHlOb3RGb3JQcm9kdWN0aW9uVXNlMTIzNDU2Nzg=
jwt.expiration=3600000
jwt.refresh-expiration=604800000
jwt.max-refresh-tokens-per-user=5

logging.level.com.mafia.authservice=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
