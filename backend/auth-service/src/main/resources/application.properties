spring.application.name=auth-service
server.port=${SERVER_PORT:8081}
server.forward-headers-strategy=framework

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://mafia-db:5432/mafia}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA/Hibernate defaults for local dev
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.default_schema=${SPRING_JPA_DEFAULT_SCHEMA:public}

# Security JWT Configuration (shared with game-service)
jwt.secret=${JWT_SECRET:VhUiBCj6kd1Ikwb0CrjgLBWxrW7zVFwqL+IGNnkJtrLXQW4lcZQcxBUyjEVYSLirHrqhUeaipaP8YwjO2+e0Vw==}
jwt.expiration=${JWT_EXPIRATION:3600000}

# JWT Refresh Token Configuration
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
jwt.max-refresh-tokens-per-user=${JWT_MAX_REFRESH_TOKENS_PER_USER:5}

# Logging Configuration
logging.level.com.mafia.auth=${LOGGING_LEVEL_COM_MAFIA_AUTH:DEBUG}
logging.level.org.springframework.web=${LOGGING_LEVEL_SPRING_WEB:INFO}
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_HIBERNATE_SQL:DEBUG}

# Actuator Configuration
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_EXPOSURE_INCLUDE:health}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when-authorized}
